[project]
name = "computer-ext"
version = "0.2.0"
description = "Extensions for Perplexity Computer — enhanced search, rendering, and connector tooling"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7.0"]

[project.scripts]
cext = "computer_ext.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
